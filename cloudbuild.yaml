steps:
  # Build da imagem Docker do backend
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/appunture-backend/backend:$SHORT_SHA',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/appunture-backend/backend:latest',
      './backend-java'
    ]

  # Push para Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/appunture-backend/backend:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/appunture-backend/backend:latest']

  # Deploy no Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'appunture-backend',
      '--image', 'us-central1-docker.pkg.dev/$PROJECT_ID/appunture-backend/backend:$SHORT_SHA',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--memory', '1Gi',
      '--cpu', '1',
      '--concurrency', '80',
      '--max-instances', '10',
      '--min-instances', '0',
      '--port', '8080',
      '--set-env-vars', 'SPRING_PROFILES_ACTIVE=prod,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIREBASE_PROJECT_ID=$PROJECT_ID,FIREBASE_ENABLED=true,FIREBASE_STORAGE_BUCKET=$PROJECT_ID.firebasestorage.app',
      '--set-secrets', 'GOOGLE_APPLICATION_CREDENTIALS=firebase-service-account:latest'
    ]

timeout: '1200s'
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/appunture-backend/backend:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/appunture-backend/backend:latest'
