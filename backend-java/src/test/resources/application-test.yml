# ===========================================
# Appunture Backend - Test Configuration
# ===========================================
# Esta configuração é usada durante a execução dos testes
# Desabilita serviços que dependem de credenciais externas

spring:
  profiles:
    active: test
  
  # Configuração do banco H2 em memória para testes
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# Configurações de segurança para testes
app:
  security:
    cors:
      allowed-origins:
        - "http://localhost:3000"
        - "http://localhost:8081"
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true

# Desabilitar serviços externos em testes
firebase:
  enabled: false

# Desabilitar AI em testes
ai:
  enabled: false

# Configurações de logging para testes
logging:
  level:
    com.appunture: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG