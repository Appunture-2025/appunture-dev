# application-dev.yml - Configuração para desenvolvimento local

spring:
  ai:
    vertex:
      ai:
        gemini:
          project-id: appunture-tcc
          location: us-central1
          # Usa as mesmas credenciais do Firebase para o Vertex AI
          credentials:
            uri: file:../serviceAccount.json
          chat:
            options:
              model: gemini-2.5-flash
              temperature: 0.3

server:
  port: 8080
  servlet:
    context-path: /api

# Configurações Firebase - Para desenvolvimento local
firebase:
  project-id: appunture-tcc
  # Caminho relativo ao diretório do projeto ou caminho absoluto
  service-account-key-path: ${SERVICE_ACCOUNT_PATH:../serviceAccount.json}
  storage:
    bucket: appunture-tcc.firebasestorage.app

app:
  firebase:
    enabled: true # Habilitado para desenvolvimento local com Firebase
  security:
    require-email-verified: false
    cors:
      allowed-origin-patterns:
        - http://localhost:*
        - http://127.0.0.1:*
        - http://192.168.*.*
        - http://10.*.*.*
      allowed-headers:
        - "*"
      allowed-methods:
        - "*"
      allow-credentials: true
      max-age: PT30M
    rate-limit:
      enabled: false

logging:
  level:
    com.appunture.backend: DEBUG
    org.springframework.security: DEBUG
